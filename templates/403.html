{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-red-200 bg-white p-8 text-center shadow-sm">
  <h1 class="text-2xl font-bold text-red-600">403: Access denied</h1>
  <p class="mt-2 text-sm text-slate-600">
    Your role (<strong>{{ user.get_role_display }}</strong>) can't open this page.
  </p>
  <a href="{% url 'dashboard:home' %}" class="mt-4 inline-block text-sm font-medium text-indigo-600 hover:underline">Back to dashboard</a>
</div>
{% endblock %}

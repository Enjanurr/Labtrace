{% extends "base.html" %}
{% block title %}Reset password{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-xl font-bold text-slate-900">Reset your password</h1>
  <p class="mt-1 text-sm text-slate-500">Enter your account email. A reset link will be generated.</p>
  <form method="post" novalidate class="mt-6 space-y-4">
    {% csrf_token %}
    {% include "authentication/_field.html" with field=form.email %}
    <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Send reset link</button>
  </form>
  <p class="mt-6 text-center text-sm"><a href="{% url 'authentication:login' %}" class="font-medium text-indigo-600 hover:underline">Back to sign in</a></p>
</div>
{% endblock %}
